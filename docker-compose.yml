version: "3.8"

services:
  backend:
    build: ./backend
    container_name: dcmapper-backend
    volumes:
      - ./backend:/app
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/dcmapper.db
      - ROOT_PATH=/api
    cap_add:
      - NET_RAW
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dcmapper-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
