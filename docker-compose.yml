version: "3.8"

services:
  backend:
    build: ./backend
    container_name: dcmapper-backend
    volumes:
      - ./backend:/app
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/dcmapper.db
    cap_add:
      - NET_RAW
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dcmapper-frontend
    ports:
      - "3000:443"
      # - "8008:8008"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
